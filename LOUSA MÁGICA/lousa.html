<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOUSA MÁGICA INFANTIL - MODO PAINT</title>
    <link rel="icon" type="image/png" href="img/logo.png">
    <style>
        /* Reset básico */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Comic Sans MS', 'Arial', sans-serif;
            user-select: none;
        }

        body {
            background: linear-gradient(135deg, #8BC6EC 0%, #9599E2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            width: 98%;
            max-width: 1200px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            border: 8px solid #FFD700;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 95vh;
        }

        /* Barra de Ferramentas */
        .toolbar {
            background-color: #fff9c4;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            border-bottom: 4px solid #F0F0F0;
        }

        .group {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255,255,255,0.5);
            padding: 8px 15px;
            border-radius: 15px;
        }

        label { font-weight: bold; color: #555; font-size: 0.9rem; }

        /* Paleta de Cores */
        .colors { 
            display: flex; 
            gap: 8px; 
            align-items: center; 
            flex-wrap: wrap; 
            justify-content: center;
            max-width: 480px; 
        }

        .color {
            width: 25px; height: 25px;
            border-radius: 50%; cursor: pointer;
            border: 2px solid white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }
        .color:hover { transform: scale(1.2); }
        .color.active { border: 3px solid #333; transform: scale(1.2); }

        /* Color Picker Customizado */
        #colorPicker {
            width: 35px;
            height: 35px;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            overflow: hidden;
        }
        #colorPicker::-webkit-color-swatch-wrapper { padding: 0; }
        #colorPicker::-webkit-color-swatch { border: 2px solid white; border-radius: 50%; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }

        /* Botões */
        .btn {
            border: none; padding: 8px 12px;
            border-radius: 10px; font-size: 0.9rem;
            cursor: pointer; font-weight: bold;
            color: white; transition: 0.2s;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Cores específicas dos botões */
        .tool-btn { background-color: #FF9800; }
        .btn.eraser { background-color: #9c27b0; }
        .btn.action { background-color: #607D8B; }
        .btn.clear { background-color: #ff4757; }
        .btn.confirm { background-color: #4CAF50; }
        .btn.cancel { background-color: #ff9800; }

        .btn:hover { transform: translateY(-2px); filter: brightness(1.1); }
        .btn:active { transform: translateY(0); box-shadow: none; }

        /* Estilo para ferramenta ativa */
        .btn.active {
            box-shadow: inset 0 0 0 3px #333; 
            transform: scale(0.95);
            background-color: #333;
        }

        /* Canvas */
        canvas {
            width: 100%; height: 100%;
            cursor: crosshair;
            touch-action: none; 
            background: white;
        }

        /* Modal */
        .modal-overlay {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000;
        }

        .hidden { display: none; }

        .modal-content {
            background: white; padding: 30px;
            border-radius: 20px; text-align: center;
            border: 5px solid #ff4757;
            animation: popIn 0.3s;
        }

        .modal-buttons {
            display: flex; justify-content: center; gap: 15px; margin-top: 20px;
        }

        @keyframes popIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="toolbar">

            <div class="group">
                <label>Cor:</label>
                <div class="colors">
                    <div class="color active" style="background: #000000;" onclick="setColor('#000000', this)"
                        title="Preto"></div>
                    <div class="color" style="background: #FFFFFF;" onclick="setColor('#FFFFFF', this)" title="Branco">
                    </div>
                    <div class="color" style="background: #808080;" onclick="setColor('#808080', this)" title="Cinza">
                    </div>

                    <div class="color" style="background: #FF0000;" onclick="setColor('#FF0000', this)"
                        title="Vermelho"></div>
                    <div class="color" style="background: #FF4500;" onclick="setColor('#FF4500', this)"
                        title="Laranja avermelhado"></div>
                    <div class="color" style="background: #FFA500;" onclick="setColor('#FFA500', this)" title="Laranja">
                    </div>
                    <div class="color" style="background: #FFD700;" onclick="setColor('#FFD700', this)" title="Dourado">
                    </div>
                    <div class="color" style="background: #FFFF00;" onclick="setColor('#FFFF00', this)" title="Amarelo">
                    </div>

                    <div class="color" style="background: #ADFF2F;" onclick="setColor('#ADFF2F', this)"
                        title="Verde lima"></div>
                    <div class="color" style="background: #00FF00;" onclick="setColor('#00FF00', this)"
                        title="Verde brilhante"></div>
                    <div class="color" style="background: #008000;" onclick="setColor('#008000', this)" title="Verde">
                    </div>
                    <div class="color" style="background: #006400;" onclick="setColor('#006400', this)"
                        title="Verde escuro"></div>

                    <div class="color" style="background: #00FFFF;" onclick="setColor('#00FFFF', this)" title="Ciano">
                    </div>
                    <div class="color" style="background: #00BFFF;" onclick="setColor('#00BFFF', this)"
                        title="Azul piscina"></div>
                    <div class="color" style="background: #0000FF;" onclick="setColor('#0000FF', this)" title="Azul">
                    </div>
                    <div class="color" style="background: #000080;" onclick="setColor('#000080', this)"
                        title="Azul marinho"></div>

                    <div class="color" style="background: #800080;" onclick="setColor('#800080', this)" title="Roxo">
                    </div>
                    <div class="color" style="background: #FF00FF;" onclick="setColor('#FF00FF', this)" title="Magenta">
                    </div>
                    <div class="color" style="background: #FF69B4;" onclick="setColor('#FF69B4', this)"
                        title="Rosa choque"></div>
                    <div class="color" style="background: #FFC0CB;" onclick="setColor('#FFC0CB', this)"
                        title="Rosa claro"></div>
                    <div class="color" style="background: #8B4513;" onclick="setColor('#8B4513', this)" title="Marrom">
                    </div>

                    <input type="color" id="colorPicker" value="#000000" onchange="setCustomColor(this.value)"
                        title="Escolher outra cor">
                </div>
            </div>

            <div class="group">
                <label>Traço:</label>
                <input type="range" id="brushSize" min="2" max="50" value="5" onchange="setSize(this.value)">
            </div>

            <div class="group">
                <button class="btn tool-btn active" id="btn-brush" onclick="setTool('brush')">🖌️ Pincel</button>
                <button class="btn tool-btn" id="btn-line" onclick="setTool('line')">📏 Linha</button>
                <button class="btn tool-btn" id="btn-rect" onclick="setTool('rect')">🔲 Quadrado</button>
                <button class="btn tool-btn" id="btn-circle" onclick="setTool('circle')">⭕ Círculo</button>
                <button class="btn tool-btn" id="btn-bucket" onclick="setTool('bucket')">🪣 Balde</button>
                <button class="btn eraser" id="btn-eraser" onclick="setTool('eraser')">🧽 Borracha</button>
            </div>

            <div class="group">
                <button class="btn action" onclick="undoDrawing()">↩️ Desfazer</button>
                <button class="btn clear" onclick="openModal()">🗑️ Limpar</button>
            </div>
        </div>

        <canvas id="drawingBoard"></canvas>
    </div>

    <div id="confirmModal" class="modal-overlay hidden">
        <div class="modal-content">
            <h2>Quer apagar o desenho todo? 😮</h2>
            <div class="modal-buttons">
                <button class="btn confirm" onclick="confirmClear()">Sim, apagar!</button>
                <button class="btn cancel" onclick="closeModal()">Não, voltar</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('drawingBoard');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const modal = document.getElementById('confirmModal');

        // Estados do Jogo
        let painting = false;
        let color = '#000000'; 
        let lineWidth = 5;
        let currentTool = 'brush'; 

        // Variáveis para formas e desfazer
        let startX, startY;
        let snapshot; 
        let undoStack = []; 

        function resizeCanvas() {
            canvas.width = canvas.parentElement.offsetWidth;
            canvas.height = canvas.parentElement.offsetHeight - document.querySelector('.toolbar').offsetHeight;
            
            // Fundo inicial branco
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            saveState(); 
        }

        window.addEventListener('resize', resizeCanvas);
        window.onload = resizeCanvas;

        // --- SISTEMA DE UNDO (DESFAZER) ---
        function saveState() {
            if (undoStack.length > 20) undoStack.shift(); 
            undoStack.push(canvas.toDataURL());
        }

        function undoDrawing() {
            if (undoStack.length > 1) {
                undoStack.pop(); 
                let lastState = undoStack[undoStack.length - 1]; 
                let img = new Image();
                img.src = lastState;
                img.onload = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0);
                }
            } else if (undoStack.length === 1) {
                ctx.fillStyle = 'white';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
        }

        // --- COORDENADAS ---
        function getCoordinates(e) {
            let clientX, clientY;
            if(e.type.includes('touch')) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            const rect = canvas.getBoundingClientRect();
            return {
                x: Math.floor(clientX - rect.left),
                y: Math.floor(clientY - rect.top)
            };
        }

        // --- DESENHO PRINCIPAL ---
        function startPosition(e) {
            painting = true;
            const coords = getCoordinates(e);
            startX = coords.x;
            startY = coords.y;

            saveState(); 

            if (currentTool === 'bucket') {
                floodFill(coords.x, coords.y, hexToRgb(color));
                painting = false;
                return;
            }

            snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);

            if (currentTool === 'brush' || currentTool === 'eraser') {
                ctx.beginPath();
                ctx.moveTo(startX, startY);
                draw(e); 
            }
        }

        function endPosition() {
            painting = false;
            ctx.beginPath();
        }

        function draw(e) {
            if (!painting || currentTool === 'bucket') return;

            const coords = getCoordinates(e);

            ctx.lineWidth = lineWidth;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = (currentTool === 'eraser') ? 'white' : color;

            if (currentTool === 'brush' || currentTool === 'eraser') {
                ctx.lineTo(coords.x, coords.y);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(coords.x, coords.y);
            } else {
                ctx.putImageData(snapshot, 0, 0);
                ctx.beginPath();

                if (currentTool === 'line') {
                    ctx.moveTo(startX, startY);
                    ctx.lineTo(coords.x, coords.y);
                } else if (currentTool === 'rect') {
                    ctx.rect(startX, startY, coords.x - startX, coords.y - startY);
                } else if (currentTool === 'circle') {
                    // Círculo com dinâmica perfeita (clique e arraste pelas pontas)
                    let centroX = (startX + coords.x) / 2;
                    let centroY = (startY + coords.y) / 2;
                    let raioX = Math.abs(coords.x - startX) / 2;
                    let raioY = Math.abs(coords.y - startY) / 2;
                    ctx.ellipse(centroX, centroY, raioX, raioY, 0, 0, 2 * Math.PI);
                }
                ctx.stroke();
            }
        }

        // --- BALDINHO DE TINTA (Flood Fill Melhorado) ---
        function floodFill(startX, startY, fillColor) {
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const pixelData = imageData.data;
            const startPos = (startY * canvas.width + startX) * 4;
            
            const startR = pixelData[startPos];
            const startG = pixelData[startPos + 1];
            const startB = pixelData[startPos + 2];
            
            const tolerance = 50; 

            if (Math.abs(startR - fillColor[0]) <= tolerance &&
                Math.abs(startG - fillColor[1]) <= tolerance &&
                Math.abs(startB - fillColor[2]) <= tolerance) {
                return;
            }

            const pixelStack = [[startX, startY]];

            while (pixelStack.length > 0) {
                const newPos = pixelStack.pop();
                const x = newPos[0];
                let y = newPos[1];

                let pixelPos = (y * canvas.width + x) * 4;
                
                while (y-- >= 0 && matchColor(pixelPos, startR, startG, startB, tolerance, pixelData)) {
                    pixelPos -= canvas.width * 4;
                }
                
                pixelPos += canvas.width * 4;
                y++;
                let reachLeft = false;
                let reachRight = false;

                while (y++ < canvas.height - 1 && matchColor(pixelPos, startR, startG, startB, tolerance, pixelData)) {
                    colorPixel(pixelPos, fillColor, pixelData);

                    if (x > 0) {
                        if (matchColor(pixelPos - 4, startR, startG, startB, tolerance, pixelData)) {
                            if (!reachLeft) {
                                pixelStack.push([x - 1, y]);
                                reachLeft = true;
                            }
                        } else if (reachLeft) { reachLeft = false; }
                    }

                    if (x < canvas.width - 1) {
                        if (matchColor(pixelPos + 4, startR, startG, startB, tolerance, pixelData)) {
                            if (!reachRight) {
                                pixelStack.push([x + 1, y]);
                                reachRight = true;
                            }
                        } else if (reachRight) { reachRight = false; }
                    }
                    pixelPos += canvas.width * 4;
                }
            }
            ctx.putImageData(imageData, 0, 0);
        }

        function matchColor(pixelPos, r, g, b, tolerance, pixelData) {
            const pr = pixelData[pixelPos];
            const pg = pixelData[pixelPos + 1];
            const pb = pixelData[pixelPos + 2];
            return (
                Math.abs(pr - r) <= tolerance &&
                Math.abs(pg - g) <= tolerance &&
                Math.abs(pb - b) <= tolerance
            );
        }

        function colorPixel(pixelPos, fillColor, pixelData) {
            pixelData[pixelPos] = fillColor[0];
            pixelData[pixelPos + 1] = fillColor[1];
            pixelData[pixelPos + 2] = fillColor[2];
            pixelData[pixelPos + 3] = 255; 
        }

        function hexToRgb(hex) {
            const r = parseInt(hex.substring(1, 3), 16);
            const g = parseInt(hex.substring(3, 5), 16);
            const b = parseInt(hex.substring(5, 7), 16);
            return [r, g, b];
        }

        // --- CONTROLES DA INTERFACE ---
        function setTool(toolName) {
            currentTool = toolName;
            document.querySelectorAll('.tool-btn, .eraser').forEach(btn => btn.classList.remove('active'));
            document.getElementById('btn-' + toolName).classList.add('active');
        }

        function setColor(newColor, element) {
            color = newColor;
            document.getElementById('colorPicker').value = newColor; 
            updateColorUI(element);
        }

        function setCustomColor(newColor) {
            color = newColor;
            updateColorUI(null);
        }

        function updateColorUI(activeElement) {
            document.querySelectorAll('.color').forEach(el => el.classList.remove('active'));
            if (activeElement) {
                activeElement.classList.add('active');
            }
        }

        function setSize(newSize) {
            lineWidth = newSize;
        }

        // --- MODAL LIMPAR ---
        function openModal() { modal.classList.remove('hidden'); }
        function closeModal() { modal.classList.add('hidden'); }
        function confirmClear() {
            saveState(); 
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            closeModal();
        }

        // --- EVENTOS DO MOUSE/TOUCH ---
        canvas.addEventListener('mousedown', startPosition);
        canvas.addEventListener('mouseup', endPosition);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseout', endPosition); 

        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startPosition(e); }, {passive: false});
        canvas.addEventListener('touchend', (e) => { e.preventDefault(); endPosition(); }, {passive: false});
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e); }, {passive: false});
    </script>
</body>

</html>
