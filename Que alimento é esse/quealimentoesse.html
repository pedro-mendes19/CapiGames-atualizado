<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Que Alimento é Esse?</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
      margin: 0;
      padding: 0;
      text-align: center;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      user-select: none;
      text-transform: uppercase;
    }

    #intro-screen {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      position: relative;
      background: #cfeec0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .capa-container {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 1920px;
      overflow: hidden;
    }

    .img-capa-fundo {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    .conteudo-central {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .img-capa-frente {
      width: auto;
      height: auto;
      max-width: 90%;
      max-height: 67vh;
      object-fit: contain;
      margin-bottom: 20px;
      animation: flutuarImagem 3s infinite ease-in-out;
    }

    @keyframes flutuarImagem {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    @keyframes pulsarBotao {
      0% { transform: scale(1); box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3); }
      50% { transform: scale(1.1); box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5); }
      100% { transform: scale(1); box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3); }
    }

    .btn-jogar-capa {
      font-family: 'Fredoka', sans-serif;
      background: linear-gradient(to bottom, #76bd4e, #518639);
      color: white;
      font-size: clamp(20px, 10vw, 34px);
      font-weight: 960;
      padding: 22px 80px;
      border: 4px solid #fff;
      border-radius: 50px;
      cursor: pointer;
      text-transform: uppercase;
      white-space: nowrap;
      pointer-events: auto;
      animation: pulsarBotao 1.2s infinite ease-in-out;
      transition: background 0.3s;
    }

    .btn-jogar-capa:hover {
      background: linear-gradient(to bottom, #7baf51, #5d853d);
    }

    #game-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      background: linear-gradient(180deg, #e0f7fa 0%, #a5d6a7 100%);
      overflow: hidden;
      padding-top: 5px;
    }

    .logo-game {
      display: block;
      margin: 5px auto 10px auto;
      max-width: 90%;
      height: auto;
      max-height: 11vh;
      object-fit: contain;
      filter: drop-shadow(0px 5px 5px rgba(0, 0, 0, 0.2));
      flex-shrink: 0;
    }

    .cartao-jogo {
      background-color: #ffffffb0;
      border-radius: 30px;
      padding: 10px 15px;
      width: 90%;
      max-width: 800px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      border: 3px dashed #6398B6;
      position: relative;
      margin-bottom: 1vh;
      box-sizing: border-box;
    }

    #painel-quiz {
      display: none;
      flex-direction: column;
      justify-content: center;
    }

    #painel-final {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 300px;
      margin-top: 20px;
      padding: 6vh 4vw;
    }

    .dica-container {
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
      background: #f5fbff;
      border: 3px solid #6398B6;
      border-radius: 30px;
      padding: 20px;
      position: relative;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
      box-sizing: border-box;
    }

    .linha-dos-botoes {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      width: 100%;
      padding: 0 5px;
      margin-bottom: -15px;
      box-sizing: border-box;
      z-index: 10;
      position: relative;
    }

    .contador-perguntas {
      font-size: 14px;
      font-weight: 800;
      color: #0288d1;
      background: #e1f5fe;
      border: 2px solid #4FC3F7;
      border-radius: 20px;
      padding: 3px 10px;
      display: inline-block;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    #dica {
      font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
      font-size: clamp(18px, 4vw, 24px);
      font-weight: 800;
      color: #5d4037;
      line-height: 1.3;
      margin-top: 0;
      text-align: center;
    }

    .btn-som,
    .btn-mudo {
      background: #ffe0b2;
      border: none;
      border-radius: 50px;
      padding: 8px 15px;
      font-size: 18px;
      font-weight: bold;
      color: #e65100;
      cursor: pointer;
      box-shadow: 0 4px 0 #ffb74d;
      transition: all 0.1s;
    }

    .btn-mudo {
      background: #ffcdd2;
      color: #c62828;
      box-shadow: 0 4px 0 #ef9a9a;
    }

    .btn-som:active { transform: translateY(4px); box-shadow: 0 0 0 #ffb74d; }
    .btn-mudo:active { transform: translateY(4px); box-shadow: 0 0 0 #ef9a9a; }

    .opcoes {
      display: flex;
      justify-content: center;
      gap: 1.5vh;
      flex-wrap: wrap;
      margin-top: 2vh;
      padding: 0 10px;
    }

    .opcao {
      background: #f5fff6;
      border: 3px solid #2e7d32;
      border-radius: 25px;
      box-shadow: 0 5px 0 #2e7d32;
      padding: 1.5vh 10px;
      width: clamp(120px, 35%, 150px);
      cursor: pointer;
      font-size: clamp(16px, 4vw, 20px);
      font-weight: 900;
      color: #2e7d32;
      transition: all 0.1s;
      margin-bottom: 0.5vh;
    }

    .opcao:hover { background-color: #e8f5e9; transform: translateY(-2px); }
    .opcao:active { transform: translateY(6px); box-shadow: 0 0 0 #2e7d32; }

    #area-resultado {
      margin-top: 2vh;
      min-height: 18vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #img-resposta {
      display: none;
      height: 22vh;
      width: auto;
      max-width: 250px;
      object-fit: contain;
      border-radius: 20px;
      border: 5px solid #fff;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
      margin-bottom: 1.5vh;
      background-color: white;
      transform: scale(1);
    }

    @keyframes pop {
      0% { transform: scale(0); opacity: 0; }
      80% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); }
    }

    .animar-pop { animation: pop 0.4s ease-out; }

    #texto-resultado {
      font-size: clamp(20px, 5vw, 26px);
      font-weight: 900;
      text-shadow: 2px 2px 0 #fff;
      padding: 0 20px;
    }

    .btn-proxima {
      font-family: 'Fredoka', sans-serif;
      margin: 1.5vh auto;
      display: inline-block;
      padding: 1.5vh 60px;
      font-size: clamp(18px, 4vw, 24px);
      border: none;
      border-radius: 60px;
      background: linear-gradient(to bottom, #ff9c08, #ff860c);
      color: #fff;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 0.8vh 0 #e9700e, 0 15px 20px rgba(0, 0, 0, 0.2);
      transition: all 0.1s;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn-proxima:hover { background: #e9700e; transform: translateY(-2px); }
    .btn-proxima:active { transform: translateY(0.8vh); box-shadow: 0 0 0 #e9700e; }
    .btn-proxima:disabled { background: #cccccc; color: #777777; box-shadow: none; cursor: not-allowed; transform: none; pointer-events: none; }

    #mensagem-final {
      font-size: clamp(24px, 6vw, 30px);
      color: #2e7d32;
      font-weight: 900;
      margin-bottom: 25px;
      padding: 0 10px;
    }

    .resumo-placar {
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      width: 100%;
      max-width: 450px;
      margin: 0 auto 20px auto;
      gap: 25px;
      box-sizing: border-box;
    }

    .resumo-item {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px 30px;
      font-size: clamp(14px, 3.5vw, 20px);
      font-weight: bold;
      border-radius: 20px;
      color: white;
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.2);
      white-space: nowrap;
    }

    .bg-verde { background: #66bb6a; border: 2px solid #2e7d32; }
    .bg-vermelho { background: #ef5350; border: 2px solid #c62828; }

    .botoes-finais {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .btn-reiniciar {
      font-family: 'Fredoka', sans-serif;
      margin: 10px auto;
      display: inline-block;
      padding: 17px 42px;
      font-size: clamp(16px, 4vw, 22px);
      border: none;
      border-radius: 60px;
      color: #fff;
      font-weight: 900;
      cursor: pointer;
      transition: all 0.1s;
      text-transform: uppercase;
      letter-spacing: 1px;
      white-space: nowrap;
      width: 90%;
      max-width: 382px;
      box-sizing: border-box;
      background: linear-gradient(to bottom, #4FC3F7, #039BE5);
      box-shadow: 0 0.8vh 0 #0280bf, 0 15px 20px rgba(0, 0, 0, 0.2);
    }

    .btn-reiniciar:hover {
      background: #0280bf;
      transform: translateY(-2px);
    }

    .btn-reiniciar:active {
      transform: translateY(0.8vh);
      box-shadow: 0 0 0 #0280bf;
    }

    @media (max-width: 768px) {
      .logo-game {
        max-height: 10vh;
        margin-top: 5px;
        margin-bottom: 5px;
      }

      .img-capa-frente {
        max-width: 100%;
        max-height: 65vh;
        margin-bottom: 10px;
      }

      .cartao-jogo {
        width: 95%;
        padding: 1vh 10px;
        margin-bottom: 1vh;
      }

      .btn-jogar-capa {
        padding: 14px 45px;
        font-size: 22px;
      }

      .dica-container {
        padding: 10px;
      }

      #dica {
        font-size: 19px;
      }

      .opcao {
        padding: 0.8vh 10px;
        font-size: 17px;
        width: 42%;
      }

      #area-resultado {
        min-height: 18vh;
        margin-top: 0.5vh;
      }

      #img-resposta {
        height: 18vh;
        max-width: 180px;
      }

      .btn-proxima {
        padding: 1vh 30px;
        width: 90%;
        font-size: 19px;
      }

      .linha-dos-botoes {
        margin-bottom: -15px;
        padding: 0 15px;
      }

      .resumo-placar {
        gap: 12px;
        margin-bottom: 20px;
        justify-content: center;
      }

      .resumo-item {
        padding: 15px 30px;
        font-size: 17px;
      }

      .btn-reiniciar {
        font-size: 18px;
      }
    }

    @media (max-height: 667px) {
      .logo-game {
        max-height: 10vh;
        margin-top: 5px;
        margin-bottom: 5px;
      }

      .cartao-jogo {
        padding: 15px 10px;
        margin-bottom: 10px;
      }

      .dica-container {
        padding: 10px;
      }

      #dica {
        font-size: 18px;
      }

      .opcoes {
        margin-top: 10px;
        gap: 8px;
      }

      .opcao {
        width: 40%;
        font-size: 16px;
        padding: 10px 5px;
      }

      #img-resposta {
        height: 14vh;
      }
    }
  </style>
</head>

<body>

  <div id="intro-screen">
    <div class="capa-container">
      <img src="img/capafundo.png" alt="Fundo" class="img-capa-fundo">
      <div class="conteudo-central">
        <img src="img/capafrente.png" alt="Capa" class="img-capa-frente">
        <button class="btn-jogar-capa" onclick="iniciarJogo()">▶ JOGAR</button>
      </div>
    </div>
  </div>

  <div id="game-screen">
    <img src="img/titulo.png" alt="Que Alimento é Esse?" class="logo-game">

    <div id="painel-quiz" class="cartao-jogo">
      <div class="linha-dos-botoes">
        <button class="btn-som" onclick="ativarSomManual()" title="Ouvir Dica">🔊</button>
        <button class="btn-mudo" onclick="pararSom()" title="Silenciar">🔇</button>
      </div>

      <div class="dica-container">
        <div id="contador-perguntas" class="contador-perguntas">DICA 1 DE 10</div>
        <div id="dica">...</div>
      </div>

      <div class="opcoes" id="opcoes"></div>

      <div id="area-resultado">
        <img id="img-resposta" src="" alt="Imagem Resposta">
        <div id="texto-resultado"></div>
      </div>

      <button id="btn-proxima" class="btn-proxima" onclick="proxima()">PRÓXIMA ➜</button>
    </div>

    <div id="painel-final" class="cartao-jogo">
      <div id="mensagem-final">PARABÉNS!</div>

      <div class="resumo-placar">
        <div class="resumo-item bg-verde">
          ACERTOS: <span id="final-acertos">0</span>
        </div>
        <div class="resumo-item bg-vermelho">
          ERROS: <span id="final-erros">0</span>
        </div>
      </div>

      <div class="botoes-finais">
        <button class="btn-reiniciar" onclick="voltarParaIntro()">🔄 JOGAR NOVAMENTE</button>
      </div>
    </div>

  </div>

  <script>
    const bancoImagens = {
      "Maçã": "img/maca.png", "Uva": "img/uva.png", "Pera": "img/pera.png", "Limão": "img/limao.png",
      "Banana": "img/banana.png", "Abacaxi": "img/abacaxi.png", "Ameixa": "img/ameixa.png",
      "Jabuticaba": "img/jabuticaba.png", "Melancia": "img/melancia.png", "Mamão": "img/mamao.png",
      "Manga": "img/manga.png", "Melão": "img/melao.png", "Laranja": "img/laranja.png",
      "Tangerina": "img/tangerina.png", "Alface": "img/alface.png", "Couve": "img/couve.png",
      "Brócolis": "img/brocolis.png", "Batata": "img/batata.png", "Mandioca": "img/mandioca.png",
      "Cenoura": "img/cenoura.png", "Morango": "img/morango.png", "Tomate": "img/tomate.png", "Cebola": "img/cebola.png",
      "Milho": "img/milho.png", "Caju": "img/caju.png", "Abacate": "img/abacate.png",
      "Goiaba": "img/goiaba.png", "Abóbora": "img/abobora.png"
    };

    const todasAsPerguntas = [
      { dica: "Uma fruta redonda, vermelha ou verde e muito usada em sucos.", correta: "Maçã", opcoes: ["Maçã", "Uva", "Pera"] },
      { dica: "Uma fruta verde por fora e azeda por dentro. Faz um suco refrescante.", correta: "Limão", opcoes: ["Banana", "Limão", "Abacaxi"] },
      { dica: "É pequena, roxa ou verde e cresce em cachos.", correta: "Uva", opcoes: ["Uva", "Ameixa", "Jabuticaba"] },
      { dica: "Uma fruta doce, com casca fina e polpa macia.", correta: "Pera", opcoes: ["Maçã", "Pera", "Melancia"] },
      { dica: "Tem casca verde e por dentro é cheia de sementes.", correta: "Melancia", opcoes: ["Mamão", "Melancia", "Abacaxi"] },
      { dica: "Tem uma coroa, mas não é rei. Tem espinhos e é amarelo por dentro.", correta: "Abacaxi", opcoes: ["Manga", "Abacaxi", "Banana"] },
      { dica: "É doce, macia e muito usada no café da manhã.", correta: "Mamão", opcoes: ["Mamão", "Melão", "Pera"] },
      { dica: "Tem o mesmo nome da sua cor e é famosa por ser rica em vitamina C.", correta: "Laranja", opcoes: ["Laranja", "Limão", "Tangerina"] },
      { dica: "Tem casca colorida, é bem doce e tem um caroço no meio.", correta: "Manga", opcoes: ["Jabuticaba", "Abacaxi", "Manga"] },
      { dica: "Tem casca amarela e dura, é doce, refrescante e as sementes ficam todas juntas no centro.", correta: "Melão", opcoes: ["Melão", "Mamão", "Abacaxi"] },
      { dica: "Tem folhas verdes e leves. É muito usada em sanduíches e saladas cruas.", correta: "Alface", opcoes: ["Alface", "Couve", "Cebola"] },
      { dica: "Nasce debaixo da terra e todo mundo adora quando viro purê ou fritas!", correta: "Batata", opcoes: ["Batata", "Mandioca", "Cenoura"] },
      { dica: "É pequeno e tem as sementes do lado de fora. Faz uma sobremesa deliciosa.", correta: "Morango", opcoes: ["Uva", "Morango", "Maçã"] },
      { dica: "Muitos acham que é legume, mas é uma fruta muito usada em saladas e molhos de pizza.", correta: "Tomate", opcoes: ["Tomate", "Cebola", "Maçã"] },
      { dica: "Faz chorar quando é cortada, mas dá um sabor delicioso à comida.", correta: "Cebola", opcoes: ["Batata", "Cebola", "Cenoura"] },
      { dica: "É amarelo, cresce em espigas e vira uma pipoca deliciosa.", correta: "Milho", opcoes: ["Milho", "Batata", "Mandioca"] },
      { dica: "Tem uma castanha na ponta e é uma fruta típica do Brasil. O seu suco é muito saboroso.", correta: "Caju", opcoes: ["Caju", "Goiaba", "Manga"] },
      { dica: "Tem a casca verde, um caroço grande no meio e pode ser comido doce ou na salada.", correta: "Abacate", opcoes: ["Abacate", "Mamão", "Melão"] },
      { dica: "Pode ser branca ou vermelha por dentro e é famosa por virar um doce.", correta: "Goiaba", opcoes: ["Goiaba", "Pera", "Maçã"] },
      { dica: "É grande, tem a casca dura. Fica uma delícia numa sopa bem quentinha ou num doce tradicional!", correta: "Abóbora", opcoes: ["Abóbora", "Melão", "Batata"] }
    ];

    let perguntasDaRodada = [];
    let atual = 0;
    let respondeu = false;
    let acertos = 0;
    let erros = 0;
    let somLigado = true;

    function embaralhar(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function iniciarJogo() {
      document.getElementById('intro-screen').style.display = 'none';
      document.getElementById('game-screen').style.display = 'flex';
      document.getElementById("painel-quiz").style.display = "flex";
      document.getElementById("painel-final").style.display = "none";

      atual = 0;
      acertos = 0;
      erros = 0;
      somLigado = true;

      let perguntasCopiadas = [...todasAsPerguntas];
      perguntasCopiadas = embaralhar(perguntasCopiadas);
      perguntasDaRodada = perguntasCopiadas.slice(0, 10);

      mostrar();
    }

    function falarTexto(texto, forcar = false) {
      if (!somLigado && !forcar) return;
      window.speechSynthesis.cancel();
      const voz = new SpeechSynthesisUtterance();
      voz.text = texto;
      voz.lang = "pt-BR";
      voz.rate = 1.1;
      window.speechSynthesis.speak(voz);
    }

    function pararSom() {
      window.speechSynthesis.cancel();
      somLigado = false;
    }

    function ativarSomManual() {
      somLigado = true;
      if (atual < perguntasDaRodada.length) {
        falarTexto(perguntasDaRodada[atual].dica, true);
      }
    }

    function mostrar() {
      respondeu = false;
      const btnProxima = document.getElementById("btn-proxima");
      btnProxima.disabled = true;
      document.getElementById("contador-perguntas").innerText = "DICA " + (atual + 1) + " DE " + perguntasDaRodada.length;

      const p = perguntasDaRodada[atual];
      document.getElementById("dica").innerText = p.dica;
      falarTexto(p.dica);

      const area = document.getElementById("opcoes");
      area.innerHTML = "";
      
      let opcoesEmbaralhadas = embaralhar([...p.opcoes]);
      
      opcoesEmbaralhadas.forEach(opcao => {
        const div = document.createElement("div");
        div.className = "opcao";
        div.innerText = opcao;
        div.onclick = () => responder(opcao);
        area.appendChild(div);
      });

      document.getElementById("texto-resultado").innerText = "";
      document.getElementById("img-resposta").style.display = "none";
      document.getElementById("area-resultado").classList.remove("animar-pop");
    }

    function responder(escolha) {
      if (respondeu) return;

      const correta = perguntasDaRodada[atual].correta;
      let mensagemVoz = "";
      const divResultado = document.getElementById("texto-resultado");
      const imgResultado = document.getElementById("img-resposta");
      const areaResultado = document.getElementById("area-resultado");
      const btnProxima = document.getElementById("btn-proxima");

      if (escolha === correta) {
        divResultado.innerText = "✅ Muito bem! A resposta é " + correta + "!";
        divResultado.style.color = "#2e7d32";
        mensagemVoz = "Muito bem! A resposta é " + correta + "!";
        acertos++;
      } else {
        divResultado.innerText = "❌ Ops! A resposta correta é " + correta + "!";
        divResultado.style.color = "#c62828";
        mensagemVoz = "Ops! A resposta correta é " + correta + "!";
        erros++;
      }

      const urlImagem = bancoImagens[correta] || "";
      if (urlImagem) {
        imgResultado.src = urlImagem;
        imgResultado.style.display = "block";
      }

      areaResultado.classList.remove("animar-pop");
      void areaResultado.offsetWidth;
      areaResultado.classList.add("animar-pop");

      respondeu = true;
      btnProxima.disabled = false;
      falarTexto(mensagemVoz);
    }

    function proxima() {
      if (!respondeu) return;
      atual++;
      if (atual < perguntasDaRodada.length) {
        mostrar();
      } else {
        document.getElementById("painel-quiz").style.display = "none";
        document.getElementById("painel-final").style.display = "flex";

        document.getElementById("final-acertos").innerText = acertos;
        document.getElementById("final-erros").innerText = erros;

        let msgVisual = "";
        let msgFalada = "";
        const total = acertos + erros;

        if (acertos === total) {
          msgVisual = "🏆 UAU! VOCÊ ACERTOU TUDO! PARABÉNS!";
          msgFalada = "Uau! Você acertou tudo! Parabéns!";
        } else if (acertos > erros) {
          msgVisual = "🎉 MUITO BEM! VOCÊ FOI INCRÍVEL!";
          msgFalada = "Muito bem! Você foi incrível!";
        } else {
          msgVisual = "💪 BOM JOGO! VAMOS TENTAR DE NOVO?";
          msgFalada = "Bom jogo! Vamos tentar de novo?";
        }

        document.getElementById("mensagem-final").innerText = msgVisual;
        falarTexto(msgFalada + " Você acertou " + acertos + " e errou " + erros);
      }
    }

    function voltarParaIntro() {
      window.speechSynthesis.cancel();
      document.getElementById('game-screen').style.display = 'none';
      document.getElementById('intro-screen').style.display = 'flex';
    }
  </script>
</body>

</html>
