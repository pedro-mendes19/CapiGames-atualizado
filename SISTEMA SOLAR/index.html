<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorador do Sistema Solar - Detalhado</title>
    <link rel="icon" type="image/png" href="img/logo.png">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Fundo Estrelado Fixo */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 3px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 2px);
            background-size: 550px 550px, 350px 350px;
            z-index: -1;
        }

        header {
            text-align: center;
            margin-top: 30px;
            margin-bottom: 20px;
            z-index: 2;
        }

        h1 { color: #fff; text-transform: uppercase; letter-spacing: 4px; font-weight: 300; border-bottom: 1px solid #333; padding-bottom: 10px; }
        p { color: #888; font-size: 0.9rem; }

        /* Container dos planetas */
        .solar-system {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 40px 20px;
            overflow-x: auto;
            width: 95%;
            max-width: 1400px;
        }

        .planet-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.3s;
            flex-shrink: 0;
        }

        .planet-container:hover {
            transform: scale(1.1);
        }

        .planet-container:hover .planet-name {
            color: #4facfe;
            text-shadow: 0 0 10px rgba(79, 172, 254, 0.5);
        }

        .planet-img {
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 0 15px rgba(0,0,0,0.8);
            transition: box-shadow 0.3s;
        }

        .planet-container:hover .planet-img {
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.2);
        }

        .planet-name {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #aaa;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.3s;
        }

        /* --- TAMANHOS VISUAIS --- */
        .size-sol { width: 160px; height: 160px; box-shadow: 0 0 50px #ff660044; }
        .size-mercurio { width: 30px; height: 30px; }
        .size-venus { width: 50px; height: 50px; }
        .size-terra { width: 52px; height: 52px; }
        .size-marte { width: 40px; height: 40px; }
        .size-jupiter { width: 120px; height: 120px; }
        .size-saturno { width: 140px; height: 70px; border-radius: 0 !important; object-fit: contain; }
        .size-urano { width: 70px; height: 70px; }
        .size-netuno { width: 68px; height: 68px; }

        /* --- ESTILO DO MODAL --- */
        #info-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(8px);
        }

        .modal-content {
            background: #111;
            width: 90%;
            max-width: 900px; /* Aumentei um pouco para caber mais texto */
            border-radius: 15px;
            border: 1px solid #333;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            display: flex;
            overflow: hidden;
            position: relative;
            animation: fadeIn 0.4s ease-out;
            max-height: 90vh; /* Limite de altura */
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-img-container {
            width: 40%;
            background: black;
            display: flex;
            align-items: center;
            justify-content: center;
            border-right: 1px solid #333;
        }

        #modal-img-big {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .modal-text {
            width: 60%;
            padding: 30px;
            display: flex;
            flex-direction: column;
            overflow-y: auto; /* Permite rolar o texto se for muito grande */
        }

        .close-btn {
            position: absolute;
            top: 15px; right: 20px;
            font-size: 2rem;
            color: #555;
            cursor: pointer;
            background: none;
            border: none;
            z-index: 5;
        }
        .close-btn:hover { color: #fff; }

        #modal-title { color: #fff; font-size: 2.2rem; margin: 0 0 10px 0; }
        #modal-desc { font-size: 1rem; line-height: 1.5; color: #ccc; margin-bottom: 20px; text-align: justify; }
        
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-top: 10px;
            background: #161616;
            padding: 15px;
            border-radius: 10px;
        }

        .stat-item {
            margin-bottom: 10px;
        }
        
        .stat-label { 
            font-size: 0.85rem; 
            color: #4facfe; 
            display: block; 
            margin-bottom: 5px; 
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid #333;
            padding-bottom: 2px;
        }

        /* Lista de fatos personalizada */
        .fact-list {
            margin: 0;
            padding-left: 20px;
            color: #ddd;
            font-size: 0.9rem;
            line-height: 1.6;
        }
        .fact-list li {
            margin-bottom: 8px;
        }

        @media (max-width: 768px) {
            .modal-content { flex-direction: column; height: 85vh; }
            .modal-img-container { width: 100%; height: 200px; border-right: none; border-bottom: 1px solid #333; flex-shrink: 0; }
            .modal-text { width: 100%; padding: 20px; }
        }

        /* ============================================================
           GAME OVERLAY — PREMIUM OVERHAUL
           ============================================================ */
        #game-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at 30% 20%, #0d1130 0%, #060612 50%, #000 100%);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
            overflow-x: hidden;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            transition: opacity 0.5s ease;
        }

        /* Starfield inside game overlay */
        #game-overlay::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 3px),
                radial-gradient(white, rgba(255,255,255,.1) 1px, transparent 2px);
            background-size: 450px 450px, 300px 300px;
            background-position: 50px 50px, 0 0;
            pointer-events: none;
            opacity: 0.5;
        }

        .game-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
            padding: 45px 40px;
            width: 95%;
            max-width: 680px;
            text-align: center;
            box-shadow:
                0 30px 60px rgba(0,0,0,0.5),
                inset 0 1px 0 rgba(255,255,255,0.05);
            position: relative;
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            z-index: 1;
        }

        /* Animações de Entrada/Saída */
        .card-enter { opacity: 0; transform: translateY(30px) scale(0.97); }
        .card-active { opacity: 1; transform: translateY(0) scale(1); }
        .card-exit { opacity: 0; transform: translateY(-30px) scale(0.97); }

        /* Question label chip */
        .question-label {
            display: inline-block;
            background: rgba(79, 172, 254, 0.12);
            border: 1px solid rgba(79, 172, 254, 0.25);
            color: #4facfe;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 6px 16px;
            border-radius: 30px;
            margin-bottom: 22px;
        }

        #question-text {
            font-size: clamp(1.1rem, 3vw, 1.55rem);
            margin-bottom: 35px;
            line-height: 1.5;
            color: #fff;
            font-weight: 300;
            letter-spacing: 0.3px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        @media (max-width: 560px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
            .game-card {
                padding: 30px 20px;
            }
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 18px 22px;
            border-radius: 14px;
            color: rgba(255,255,255,0.85);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 1rem;
            font-weight: 500;
            text-align: center;
            position: relative;
            outline: none;
            overflow: hidden;
        }

        .option-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.05), transparent);
            border-radius: 14px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .option-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(79, 172, 254, 0.4);
            color: #fff;
            transform: translateY(-3px);
            box-shadow: 0 12px 28px rgba(0,0,0,0.3);
        }

        .option-btn:hover::before {
            opacity: 1;
        }

        .option-btn.correct {
            background: rgba(46, 204, 113, 0.15);
            border-color: #2ecc71;
            box-shadow: 0 0 25px rgba(46, 204, 113, 0.25), inset 0 0 20px rgba(46, 204, 113, 0.05);
            color: #fff;
            transform: translateY(-2px);
        }

        .option-btn.wrong {
            background: rgba(231, 76, 60, 0.15);
            border-color: #e74c3c;
            box-shadow: 0 0 25px rgba(231, 76, 60, 0.2);
            color: #fff;
            animation: wrongShake 0.5s ease-in-out;
        }

        .option-btn.dimmed {
            opacity: 0.3;
            transform: scale(0.97);
        }

        @keyframes wrongShake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-6px); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }

        /* -------- PLANET REVEAL after answer -------- */
        .planet-reveal {
            margin-top: 30px;
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 20px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 18px;
            animation: revealSlideUp 0.6s cubic-bezier(0.23, 1, 0.32, 1) forwards;
            opacity: 0;
        }

        @keyframes revealSlideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .planet-reveal img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 0 20px rgba(79,172,254,0.2);
            flex-shrink: 0;
            border: 2px solid rgba(255,255,255,0.1);
        }

        .planet-reveal-text {
            text-align: left;
        }

        .planet-reveal-text h4 {
            margin: 0 0 4px 0;
            font-size: 1.1rem;
            font-weight: 700;
            color: #fff;
        }

        .planet-reveal-text p {
            margin: 0;
            font-size: 0.8rem;
            line-height: 1.5;
            color: rgba(255,255,255,0.55);
        }

        .planet-reveal.correct-reveal {
            border-color: rgba(46, 204, 113, 0.2);
            background: rgba(46, 204, 113, 0.04);
        }

        .planet-reveal.wrong-reveal {
            border-color: rgba(231, 76, 60, 0.2);
            background: rgba(231, 76, 60, 0.04);
        }

        @media (max-width: 480px) {
            .planet-reveal {
                flex-direction: column;
                text-align: center;
                gap: 12px;
            }
            .planet-reveal-text {
                text-align: center;
            }
            .planet-reveal img {
                width: 64px;
                height: 64px;
            }
        }

        /* -------- GAME HEADER -------- */
        .game-header {
            width: 100%;
            max-width: 680px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            color: rgba(255,255,255,0.45);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            z-index: 1;
        }

        .score-display {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,255,255,0.04);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.06);
            font-variant-numeric: tabular-nums;
        }

        .score-display .score-icon {
            font-size: 0.9rem;
        }

        .progress-bar-container {
            width: 100%;
            max-width: 680px;
            height: 3px;
            background: rgba(255,255,255,0.04);
            border-radius: 2px;
            margin-bottom: 30px;
            overflow: hidden;
            z-index: 1;
        }

        #progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
            width: 0%;
            transition: width 0.8s cubic-bezier(0.65, 0, 0.35, 1);
            box-shadow: 0 0 12px rgba(79, 172, 254, 0.5);
        }

        /* -------- START GAME BUTTON -------- */
        #start-game-btn {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            border: none;
            padding: 14px 35px;
            border-radius: 40px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.9rem;
            box-shadow: 0 8px 25px rgba(0, 242, 254, 0.2);
            transition: all 0.3s ease;
            margin-bottom: 25px;
        }

        #start-game-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 12px 30px rgba(0, 242, 254, 0.4);
        }

        /* -------- EXIT BUTTON -------- */
        .exit-game {
            position: fixed;
            top: 24px;
            right: 24px;
            background: rgba(255,255,255,0.04);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.08);
            color: rgba(255,255,255,0.3);
            font-size: 1.4rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            z-index: 10;
        }

        .exit-game:hover {
            background: rgba(255,255,255,0.1);
            color: #fff;
            transform: rotate(90deg);
        }

        /* -------- RESULT SCREEN -------- */
        .result-screen {
            display: none;
        }

        .rank-badge {
            font-size: 5rem;
            margin: 25px 0;
            display: block;
            filter: drop-shadow(0 0 25px rgba(255,255,255,0.15));
            animation: floatBadge 3s ease-in-out infinite;
        }

        @keyframes floatBadge {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-10px) rotate(-3deg); }
            75% { transform: translateY(-10px) rotate(3deg); }
        }

        .result-stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 20px 0;
        }

        .result-stat-item {
            text-align: center;
        }

        .result-stat-value {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .result-stat-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255,255,255,0.4);
            margin-top: 4px;
        }

        .btn-restart {
            margin-top: 25px;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: #fff;
            padding: 14px 40px;
            border-radius: 30px;
            border: none;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-size: 0.85rem;
            transition: all 0.3s;
            box-shadow: 0 8px 25px rgba(0, 242, 254, 0.2);
        }

        .btn-restart:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 12px 35px rgba(79, 172, 254, 0.4);
        }

        /* -------- CONFETTI -------- */
        .game-confetti {
            position: fixed;
            width: 8px;
            height: 8px;
            z-index: 2001;
            pointer-events: none;
            border-radius: 2px;
            animation: confettiFallGame var(--fall-dur) linear forwards;
        }

        @keyframes confettiFallGame {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(var(--rot)); opacity: 0; }
        }

        /* -------- PARTICLES on correct answer -------- */
        .particle {
            position: fixed;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 3000;
            animation: particleBurst 0.8s ease-out forwards;
        }

        @keyframes particleBurst {
            0% { transform: translate(0,0) scale(1); opacity: 1; }
            100% { transform: translate(var(--px), var(--py)) scale(0); opacity: 0; }
        }

    </style>
</head>
<body>

    <header>
        <h1>Sistema Solar</h1>
        <p>Clique nos astros para visualizar dados reais</p>
        <button id="start-game-btn" onclick="initGame()">Desafio Espacial</button>
    </header>

    <div class="solar-system" id="solar-system">
        </div>

    <div id="info-modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            
            <div class="modal-img-container">
                <img id="modal-img-big" src="" alt="Planeta">
            </div>

            <div class="modal-text">
                <h2 id="modal-title">Título</h2>
                <p id="modal-desc">Descrição...</p>
                
                <div class="stats-grid">
                    <div class="stat-item">
                        <span class="stat-label">Satélites & Luas</span>
                        <div id="modal-satellites" style="font-weight: bold; color: white;">-</div>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label" style="color: #ffd700;">Curiosidades</span>
                        <ul id="modal-facts" class="fact-list">
                            </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="game-overlay">
        <button class="exit-game" onclick="exitGame()">&times;</button>
        
        <div class="game-header">
            <span id="question-count">Missão: 1 / 5</span>
            <div class="score-display">
                <span class="score-icon">⭐</span>
                <span id="game-score">0</span>
            </div>
        </div>
        
        <div class="progress-bar-container">
            <div id="progress-fill"></div>
        </div>

        <div class="game-card" id="question-card">
            <div class="question-label">De qual astro é esta curiosidade?</div>
            <h3 id="question-text"></h3>
            <div class="options-grid" id="options-container"></div>
            <!-- Planet reveal area injected by JS -->
            <div id="planet-reveal-slot"></div>
        </div>

        <div class="game-card result-screen" id="result-card">
            <h2 id="result-title">Missão Completa!</h2>
            <span class="rank-badge" id="rank-emoji">🚀</span>
            <div class="result-stats">
                <div class="result-stat-item">
                    <div class="result-stat-value" id="result-correct-count">0</div>
                    <div class="result-stat-label">Acertos</div>
                </div>
                <div class="result-stat-item">
                    <div class="result-stat-value" id="result-total-score">0</div>
                    <div class="result-stat-label">Pontos</div>
                </div>
            </div>
            <p id="rank-name" style="color:rgba(255,255,255,0.5); margin-top:10px;">Patente: Cadete Espacial</p>
            <button class="btn-restart" onclick="initGame()">🔄 Tentar Novamente</button>
        </div>
    </div>

    <script>
        let currentGame = {
            questions: [],
            currentIndex: 0,
            score: 0,
            totalQuestions: 5,
            isTransitioning: false
        };

        function initGame() {
            modal.style.display = 'none';
            const overlay = document.getElementById('game-overlay');
            overlay.style.display = 'flex';
            overlay.style.opacity = '1';
            
            document.getElementById('result-card').style.display = 'none';
            const qCard = document.getElementById('question-card');
            qCard.style.display = 'block';
            qCard.className = 'game-card card-active';
            
            currentGame.score = 0;
            currentGame.currentIndex = 0;
            currentGame.questions = generateQuestions();
            
            document.getElementById('game-score').innerText = '0';
            updateGameHeader();
            showQuestion();
        }

        function generateQuestions() {
            const dataCopy = [...celestialData].sort(() => 0.5 - Math.random());
            const questions = [];
            for (let i = 0; i < currentGame.totalQuestions; i++) {
                const correctAstro = dataCopy[i];
                const randomFact = correctAstro.facts[Math.floor(Math.random() * correctAstro.facts.length)];
                const otherOptions = celestialData
                    .filter(a => a.id !== correctAstro.id)
                    .sort(() => 0.5 - Math.random())
                    .slice(0, 3)
                    .map(a => a.name);
                const options = [...otherOptions, correctAstro.name].sort(() => 0.5 - Math.random());
                questions.push({
                    text: randomFact,
                    correct: correctAstro.name,
                    options: options,
                    astro: correctAstro // keep reference for image reveal
                });
            }
            return questions;
        }

        function showQuestion() {
            const question = currentGame.questions[currentGame.currentIndex];
            const qText = document.getElementById('question-text');
            const optionsContainer = document.getElementById('options-container');
            const revealSlot = document.getElementById('planet-reveal-slot');
            
            // Clear previous reveal
            revealSlot.innerHTML = '';
            
            qText.innerText = '"' + question.text + '"';
            optionsContainer.innerHTML = '';

            question.options.forEach(option => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = option;
                btn.onclick = () => checkAnswer(option, btn);
                optionsContainer.appendChild(btn);
            });

            updateProgressBar();
            currentGame.isTransitioning = false;
        }

        function checkAnswer(selected, btn) {
            if (currentGame.isTransitioning) return;
            currentGame.isTransitioning = true;

            const question = currentGame.questions[currentGame.currentIndex];
            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(b => b.style.pointerEvents = 'none');

            const isCorrect = selected === question.correct;

            if (isCorrect) {
                btn.classList.add('correct');
                currentGame.score += 100;
                // Dim other buttons
                allBtns.forEach(b => {
                    if (b !== btn) b.classList.add('dimmed');
                });
                // Particle burst
                spawnParticles(btn);
            } else {
                btn.classList.add('wrong');
                allBtns.forEach(b => {
                    if (b.innerText === question.correct) {
                        b.classList.add('correct');
                    } else if (b !== btn) {
                        b.classList.add('dimmed');
                    }
                });
            }

            // Animate score
            animateScore(currentGame.score);

            // Show planet image reveal after a short delay
            setTimeout(() => {
                showPlanetReveal(question.astro, isCorrect);
            }, 500);

            // Transition after longer delay to let user see the image
            setTimeout(() => {
                transitionToNext();
            }, 3200);
        }

        function showPlanetReveal(astro, wasCorrect) {
            const slot = document.getElementById('planet-reveal-slot');
            const reveal = document.createElement('div');
            reveal.className = 'planet-reveal ' + (wasCorrect ? 'correct-reveal' : 'wrong-reveal');

            const img = document.createElement('img');
            img.src = astro.img;
            img.alt = astro.name;

            const textDiv = document.createElement('div');
            textDiv.className = 'planet-reveal-text';

            const h4 = document.createElement('h4');
            h4.innerText = (wasCorrect ? '✅ ' : '❌ A resposta era: ') + astro.name;

            const p = document.createElement('p');
            p.innerText = astro.desc;

            textDiv.appendChild(h4);
            textDiv.appendChild(p);
            reveal.appendChild(img);
            reveal.appendChild(textDiv);
            slot.appendChild(reveal);
        }

        function spawnParticles(btn) {
            const rect = btn.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            const colors = ['#2ecc71', '#4facfe', '#00f2fe', '#ffd700', '#fff'];
            for (let i = 0; i < 14; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = cx + 'px';
                p.style.top = cy + 'px';
                p.style.background = colors[Math.floor(Math.random() * colors.length)];
                const angle = Math.random() * Math.PI * 2;
                const dist = 40 + Math.random() * 60;
                p.style.setProperty('--px', Math.cos(angle) * dist + 'px');
                p.style.setProperty('--py', Math.sin(angle) * dist + 'px');
                document.body.appendChild(p);
                p.addEventListener('animationend', () => p.remove());
            }
        }

        function animateScore(target) {
            const el = document.getElementById('game-score');
            const start = parseInt(el.innerText) || 0;
            const duration = 400;
            const startTime = performance.now();
            function tick(now) {
                const elapsed = now - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const eased = 1 - Math.pow(1 - progress, 3);
                el.innerText = Math.round(start + (target - start) * eased);
                if (progress < 1) requestAnimationFrame(tick);
            }
            requestAnimationFrame(tick);
        }

        function transitionToNext() {
            const qCard = document.getElementById('question-card');
            qCard.classList.remove('card-active');
            qCard.classList.add('card-exit');

            setTimeout(() => {
                currentGame.currentIndex++;
                if (currentGame.currentIndex < currentGame.totalQuestions) {
                    qCard.className = 'game-card card-enter';
                    showQuestion();
                    updateGameHeader();
                    
                    // Trigger reflow
                    void qCard.offsetWidth;
                    
                    qCard.classList.remove('card-enter');
                    qCard.classList.add('card-active');
                } else {
                    showResults();
                }
            }, 600);
        }

        function updateGameHeader() {
            document.getElementById('question-count').innerText = `Missão: ${currentGame.currentIndex + 1} / ${currentGame.totalQuestions}`;
        }

        function updateProgressBar() {
            const fill = document.getElementById('progress-fill');
            const pct = (currentGame.currentIndex / currentGame.totalQuestions) * 100;
            fill.style.width = `${pct}%`;
        }

        function showResults() {
            const qCard = document.getElementById('question-card');
            const rCard = document.getElementById('result-card');
            
            qCard.style.display = 'none';
            rCard.style.display = 'block';
            rCard.className = 'game-card card-active';
            document.getElementById('progress-fill').style.width = '100%';

            const correctCount = currentGame.score / 100;
            document.getElementById('result-correct-count').innerText = correctCount;
            document.getElementById('result-total-score').innerText = currentGame.score;

            const rankEmoji = document.getElementById('rank-emoji');
            const rankName = document.getElementById('rank-name');

            if (correctCount === 5) {
                rankEmoji.innerText = '👨‍🚀';
                rankName.innerText = 'Patente: Comandante Estelar';
            } else if (correctCount >= 3) {
                rankEmoji.innerText = '🚀';
                rankName.innerText = 'Patente: Piloto Proeminente';
            } else {
                rankEmoji.innerText = '🛰️';
                rankName.innerText = 'Patente: Cadete em Treinamento';
            }

            // Confetti
            if (correctCount >= 3) spawnConfetti();
        }

        function spawnConfetti() {
            const colors = ['#4facfe', '#00f2fe', '#ffd700', '#2ecc71', '#ff6b6b', '#a55eea'];
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const c = document.createElement('div');
                    c.className = 'game-confetti';
                    c.style.left = Math.random() * 100 + 'vw';
                    c.style.top = '-10px';
                    c.style.background = colors[Math.floor(Math.random() * colors.length)];
                    c.style.setProperty('--fall-dur', (Math.random() * 2 + 1.5) + 's');
                    c.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
                    c.style.width = (Math.random() * 8 + 4) + 'px';
                    c.style.height = (Math.random() * 8 + 4) + 'px';
                    c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                    document.body.appendChild(c);
                    c.addEventListener('animationend', () => c.remove());
                }, i * 40);
            }
        }

        function exitGame() {
            const overlay = document.getElementById('game-overlay');
            overlay.style.opacity = '0';
            // Clean confetti
            document.querySelectorAll('.game-confetti').forEach(c => c.remove());
            setTimeout(() => {
                overlay.style.display = 'none';
            }, 500);
        }

        const container = document.getElementById('solar-system');
        const modal = document.getElementById('info-modal');
        const mTitle = document.getElementById('modal-title');
        const mDesc = document.getElementById('modal-desc');
        const mSat = document.getElementById('modal-satellites');
        const mFactsList = document.getElementById('modal-facts');
        const mImg = document.getElementById('modal-img-big');

        function renderPlanets() {
            container.innerHTML = '';
            
            celestialData.forEach(astro => {
                const div = document.createElement('div');
                div.className = 'planet-container';
                div.onclick = () => openModal(astro);

                const img = document.createElement('img');
                img.className = `planet-img ${astro.sizeClass}`;
                img.src = astro.img;
                img.alt = astro.name;

                const label = document.createElement('div');
                label.className = 'planet-name';
                label.innerText = astro.name;

                div.appendChild(img);
                div.appendChild(label);
                container.appendChild(div);
            });
        }

        function openModal(data) {
            mTitle.innerText = data.name;
            mDesc.innerText = data.desc;
            mSat.innerText = data.satellites;
            mImg.src = data.img; 

            // Limpa a lista anterior
            mFactsList.innerHTML = '';
            
            // Adiciona cada fato como um item de lista (li)
            data.facts.forEach(factText => {
                const li = document.createElement('li');
                li.innerText = factText;
                mFactsList.appendChild(li);
            });

            modal.style.display = 'flex';
        }

        function closeModal() {
            modal.style.display = 'none';
        }

        window.onclick = function(event) {
            if (event.target == modal) {
                closeModal();
            }
        }
