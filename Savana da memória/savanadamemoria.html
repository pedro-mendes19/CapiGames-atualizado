<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Savana da Memória</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
  <style>
    :root {
      --bg-color: #848d1c;
      --card-back: #ffbd61;
      --card-success: #90EE90;
      --card-error: #FF6961;
      --text-color: #555;
      --tamanho-carta: 110px;
    }

    body {
      font-family: 'Nunito', sans-serif;
      text-transform: uppercase;
      background-image: url(img/fundojogo.png);
      background-size: 100% 100%;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;

      padding: 8vh 12vw 6vh 12vw;
      box-sizing: border-box;

      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;

      height: 100vh;
      max-height: 100vh;
      user-select: none;
      overflow: hidden;
    }

    header {
      text-align: center;
      margin: 15px 0;
      width: 100%;
      max-width: 1000px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .nivel-badge {
      font-family: 'Nunito', sans-serif;
      background: #3a7c2d;
      color: #f0ede8;
      padding: 6px 35px;
      border-radius: 15px;
      font-size: 1.3em;
      font-weight: bold;
      border: 3px dashed #bcdfa5;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
      margin-bottom: 12px;
    }

    .painel {
      padding: 15px 30px;
      border-radius: 22px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      width: 100%;
      font-size: 1.3rem;
      color: #fff;
      font-weight: bold;
      box-sizing: border-box;
      position: relative;

      background: linear-gradient(180deg, #e4b06a 0%, #e7b873 40%, #dca45a 100%);
      border: 4px solid #a06a2e;
      box-shadow: 0 6px 0 #7a4d1f;
    }

    .painel::before {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(90deg,
          rgba(0, 0, 0, 0.08) 0px, rgba(0, 0, 0, 0.08) 2px,
          transparent 2px, transparent 14px);
      opacity: 0.25;
      pointer-events: none;
      border-radius: 18px;
    }

    .painel::after {
      content: "";
      position: absolute;
      inset: 0;
      box-shadow: inset 0 12px 20px rgba(0, 0, 0, 0.15),
        inset 0 -12px 20px rgba(0, 0, 0, 0.1);
      border-radius: 18px;
      pointer-events: none;
    }

    .info-item {
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 5;
    }

    .botoes-controle {
      display: flex;
      gap: 15px;
      z-index: 5;
    }

    .btn-icon {
      border: none;
      background: none;
      cursor: pointer;
      font-size: 1.3rem;
      color: #fff;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s;
    }

    .icon-img,
    .info-item img,
    .btn-icon img {
      width: 2.3rem;
      height: 2.3rem;
      object-fit: contain;
      display: block;
    }

    .btn-icon:hover {
      transform: scale(1.1);
    }

    .game-area {
      flex-grow: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px 0;
      width: 100%;
      box-sizing: border-box;
    }

    .game-container {
      display: grid;
      gap: 10px;
      perspective: 1000px;
      justify-content: center;
      align-content: center;
    }

    .card {
      width: var(--tamanho-carta);
      height: var(--tamanho-carta);
      position: relative;
      cursor: pointer;
      transform: scale(1);
      transition: transform 0.1s;
    }

    .card:active {
      transform: scale(0.95);
    }

    .card-inner {
      width: 100%;
      height: 100%;
      position: absolute;
      transition: transform 0.6s;
      transform-style: preserve-3d;
    }

    .card.flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card.correto .card-inner {
      animation: pulo 0.5s ease-in-out;
    }

    .card.correto .card-back {
      background-color: var(--card-success);
      border-color: #72c772;
    }

    .card.erro .card-inner {
      animation: tremer 0.4s ease-in-out;
    }

    .card.erro .card-back {
      background-color: var(--card-error);
      border-color: #e05c4b;
    }

    .card-front,
    .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 12%;
      display: flex;
      justify-content: center;
      align-items: center;
      border: 4px solid white;
      box-shadow: 0 6px 0 rgba(0, 0, 0, 0.1);
      box-sizing: border-box;
    }

    .card-front {
      background-color: var(--card-back);
      color: white;
      font-size: calc(var(--tamanho-carta) / 2.5);
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .card-back {
      background-color: #fff;
      transform: rotateY(180deg);
    }

    .card-back img {
      width: 80%;
      height: 80%;
      object-fit: contain;
    }

    @keyframes pulo {

      0%,
      100% {
        transform: rotateY(180deg) scale(1)
      }

      50% {
        transform: rotateY(180deg) scale(1.15)
      }
    }

    @keyframes tremer {

      0%,
      100% {
        transform: rotateY(180deg) translateX(0)
      }

      25% {
        transform: rotateY(180deg) translateX(-5px)
      }

      75% {
        transform: rotateY(180deg) translateX(5px)
      }
    }

    #overlay-inicio {
      position: fixed;
      inset: 0;
      background-image: url(img/fundointro.png);
      background-position: center;
      background-size: cover;
      background-color: #000;
      z-index: 200;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .btn-start {
      background: linear-gradient(180deg, #eca644 0%, #FF8C00 100%);
      color: white;
      cursor: pointer;
      font-family: 'Nunito', sans-serif;
      font-weight: bold;
      border-radius: 50px;
      white-space: nowrap;
      text-transform: uppercase;
      text-shadow: 2px 2px 0px #cc6a00;
      font-size: clamp(20px, 5vmin, 40px);
      padding: clamp(14px, 2.5vmin, 22px) clamp(32px, 7vmin, 72px);
      border: 3px solid #fff;
      box-shadow: 0 9px 0 #a04000, 0 15px 20px rgba(0, 0, 0, 0.4);
      margin-top: 65vh;
      margin-left: 2vh;
      transition: all 0.2s ease-in-out;
      animation: pulseStart 2s infinite;
    }

    .btn-start:hover {
      background: linear-gradient(180deg, #fdbd63 0%, #ffa02e 100%);
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 11px 0 #a04000, 0 20px 25px rgba(0, 0, 0, 0.5);
    }

    .btn-start:active {
      transform: translateY(4px) scale(1);
      box-shadow: 0 4px 0 #a04000, 0 5px 10px rgba(0, 0, 0, 0.4);
      animation: none;
    }

    @keyframes pulseStart {
      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.03);
      }

      100% {
        transform: scale(1);
      }
    }

    #modal-nivel {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-content {
      padding: 45px 55px;
      border-radius: 22px;
      text-align: center;
      animation: modalUp 0.3s ease-out;
      position: relative;
      background: linear-gradient(180deg, #e4b06a 0%, #e7b873 40%, #dca45a 100%);
      border: 4px solid #a06a2e;
      box-shadow: 0 6px 0 #7a4d1f, 0 0 25px rgba(0, 0, 0, 0.4);
    }

    .modal-content::before {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(90deg,
          rgba(0, 0, 0, 0.08) 0px, rgba(0, 0, 0, 0.08) 2px,
          transparent 2px, transparent 14px);
      opacity: 0.25;
      pointer-events: none;
      border-radius: 18px;
    }

    .modal-content::after {
      content: "";
      position: absolute;
      inset: 0;
      box-shadow: inset 0 12px 20px rgba(0, 0, 0, 0.15),
        inset 0 -12px 20px rgba(0, 0, 0, 0.1);
      border-radius: 18px;
      pointer-events: none;
    }

    @keyframes modalUp {
      from {
        transform: scale(0.5);
      }

      to {
        transform: scale(1);
      }
    }

    .icone-vitoria {
      margin: 0;
      font-size: 4rem;
      position: relative;
      z-index: 5;
    }

    .titulo-vitoria {
      font-family: 'Comic Sans MS', cursive, sans-serif;
      color: #fff;
      text-shadow: 2px 2px 0px #a06a2e;
      margin: 10px 0;
      font-size: 2rem;
      position: relative;
      z-index: 5;
    }

    .texto-vitoria {
      font-family: 'Comic Sans MS', cursive, sans-serif;
      font-size: 1.2rem;
      color: #fff;
      text-shadow: 1px 1px 0px #a06a2e;
      margin-bottom: 20px;
      font-weight: bold;
      position: relative;
      z-index: 5;
    }

    .tempo-final {
      display: block;
      font-size: 2.5rem;
      color: #693600;
      margin: 15px 0;
      text-align: center;
    }

    .botoes-modal {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-top: 15px;
    }

    .btn-proximo {
      margin-top: 0;
    }

    .btn-proximo {
      background: #985e29;
      color: white;
      border: none;
      padding: 12px 35px;
      font-family: 'Nunito', sans-serif;
      font-size: 1.4rem;
      border-radius: 50px;
      cursor: pointer;
      margin-top: 15px;
      font-weight: bold;
      text-transform: uppercase;
      box-shadow: 0 5px 0 #693600, 0 8px 15px rgba(0, 0, 0, 0.2);
      transition: all 0.2s;
      position: relative;
      z-index: 5;
    }

    .btn-proximo:hover {
      background: #693600;
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 5px 0 #693600, 0 15px 25px rgba(0, 0, 0, 0.4);
    }

    .btn-proximo:active {
      transform: translateY(2px) scale(0.98);
      box-shadow: 0 3px 0 #693600, 0 5px 10px rgba(0, 0, 0, 0.2);
    }

    @media screen and (max-width: 1024px),
    screen and (max-height: 800px) {
      header {
        margin: 8px 0;
      }

      .painel {
        padding: 8px 20px;
        font-size: 1.1rem;
      }

      .nivel-badge {
        padding: 4px 25px;
        font-size: 1.1em;
        margin-bottom: 8px;
      }

      #tempo {
        font-size: 0.95rem;
      }

      .btn-icon {
        font-size: 1.1rem;
      }

      .btn-start {
        border-width: 3px;
        box-shadow: 0 6px 0 #a04000, 0 12px 18px rgba(0, 0, 0, 0.4);
      }

      .btn-start:hover {
        box-shadow: 0 8px 0 #a04000, 0 16px 22px rgba(0, 0, 0, 0.5);
      }

      .btn-start:active {
        transform: translateY(2px) scale(1);
        box-shadow: 0 3px 0 #a04000, 0 4px 8px rgba(0, 0, 0, 0.4);
      }

      .modal-content {
        padding: 20px 25px;
        border-width: 4px;
      }

      .tempo-final {
        font-size: 1.8rem;
        margin: 10px 0;
      }

      .icone-vitoria {
        font-size: 3rem;
      }

      .titulo-vitoria {
        font-size: 1.6rem;
      }

      .btn-proximo {
        padding: 8px 25px;
        font-size: 1.1rem;
        border-width: 0;
        margin-top: 5px;
        box-shadow: 0 3px 0 #693600;
      }
    }

    @media screen and (max-height: 500px) {
      body {
        padding: 10vh 6vw 3vh 6vw;
      }

      header {
        margin: 5px 0;
        width: 98%;
      }

      .painel {
        padding: 5px 15px;
        font-size: 0.95rem;
        border-width: 3px;
        box-shadow: 0 4px 0 #7a4d1f;
      }

      .btn-icon {
        font-size: 1rem;
      }

      .nivel-badge {
        padding: 3px 20px;
        font-size: 1em;
        margin-bottom: 5px;
        border-width: 2px;
      }

      #tempo {
        font-size: 0.85rem;
      }

      .info-item {
        gap: 5px;
      }

      .game-container {
        gap: 6px;
      }

      .game-area {
        margin-top: -13px;
      }

      .btn-start {
        border-width: 2px;
        box-shadow: 0 5px 0 #a04000, 0 10px 15px rgba(0, 0, 0, 0.4);
      }

      .btn-start:hover {
        box-shadow: 0 7px 0 #a04000, 0 15px 20px rgba(0, 0, 0, 0.5);
      }

      .btn-start:active {
        transform: translateY(2px) scale(1);
        box-shadow: 0 3px 0 #a04000, 0 4px 8px rgba(0, 0, 0, 0.4);
      }

      .modal-content {
        padding: 10px 15px;
        border-width: 3px;
        border-radius: 12px;
        box-shadow: 0 6px 0 #8a5a2f;
      }

      .tempo-final {
        font-size: 1.4rem;
        margin: 8px 0;
      }

      .icone-vitoria {
        font-size: 2.2rem;
      }

      .titulo-vitoria {
        font-size: 1.3rem;
        margin: 5px 0;
      }

      .texto-vitoria {
        font-size: 0.95rem;
        margin-bottom: 10px;
      }

      .btn-proximo {
        padding: 6px 18px;
        font-size: 1rem;
        border-width: 0;
        margin-top: 4px;
        box-shadow: 0 2px 0 #693600;
      }

      .modal-content::before,
      .modal-content::after {
        transform: none;
        inset: 0;
        border-radius: 8px;
      }
    }

    @media screen 
      and (min-width: 768px) 
      and (max-width: 1366px) 
      and (orientation: landscape) {

      .game-wrapper {
        width: 100%;
        height: 100%;
        padding: 20px 10px 0 10px;
        justify-content: center;
      }

      h1 {
        font-size: clamp(20px, 2.5vw, 30px);
        margin-bottom: 20px;
        padding: 12px 30px;
      }

      #container {
        max-width: 850px;
        gap: 12px;
      }

      #imagemPergunta {
        max-height: 220px;
      }

      #pergunta {
        font-size: clamp(18px, 2vw, 24px);
        padding: 16px 30px;
        max-width: 90%;
      }

      .label-progresso {
        font-size: 16px;
        padding: 8px 20px;
      }

      button.true,
      button.false {
        font-size: 18px;
        padding: 14px 28px;
        max-width: 250px;
      }

      #resultado {
        font-size: 18px;
        min-height: 55px;
        padding: 12px 20px;
      }

      #score {
        font-size: 16px;
        padding: 8px 18px;
      }

      #painelFinal {
        width: 80%;
        max-width: 650px;
        margin-top: 40px;
        padding: 30px;
      }

      #painelFinal h2 {
        font-size: 30px;
      }

      #resumo,
      #mensagemFinal {
        font-size: 20px;
      }

      .totais {
        font-size: 22px;
        gap: 30px;
      }

      .btn-reiniciar {
        font-size: 18px;
        padding: 14px 28px;
      }
    }

    .nivel-badge {
      padding: 5px 25px;
      font-size: 1.2em;
      margin-bottom: 6px;
    }

    .painel {
      padding: 8px 15px;
      font-size: 0.95rem;
    }

    .icon-img,
    .info-item img,
    .btn-icon img {
      width: 1.6rem;
      height: 1.6rem;
    }

    .info-item {
      gap: 5px;
    }

    @media screen and (orientation: portrait) {
      body {
        padding: 10vh 10vw 10vh 10vw;
        background-image: url(img/fundojogo-9.16.png);
      }

      #overlay-inicio {
        background-image: url(img/fundointro-9.16.png);
      }

      header {
        margin: 0;
        justify-content: space-between;
        flex-grow: 0;
      }

      .nivel-badge {
        padding: 2px 15px;
        font-size: 0.90em;
        margin-bottom: 8px;
        border-radius: 10px;
      }

      .painel {
        padding: 5px 12px;
        font-size: 0.9rem;
        margin-top: -2px;
      }

      .icon-img,
      .info-item img,
      .btn-icon img {
        width: 1.4rem;
        height: 1.4rem;
      }

      .info-item {
        gap: 4px;
      }

      .btn-start {
        font-size: clamp(28px, 6vmin, 44px);
        padding: clamp(16px, 4vmin, 20px) clamp(38px, 12vmin, 80px);
        margin-top: 76vh;
        border: 3px solid #fff;
        box-shadow: 0 7px 0 #a04000, 0 15px 20px rgba(0, 0, 0, 0.4);
      }

      .card-front,
      .card-back {
        border: 4px solid white;
      }

      .modal-content {
        width: 80%;
        padding: 25px 18px;
      }
    }

    @media screen and (min-width: 768px) and (orientation: portrait) {
      .nivel-badge {
        padding: 8px 30px;
        font-size: 1.4em;
        margin-bottom: 12px;
      }

      .painel {
        padding: 12px 20px;
        font-size: 1.2rem;
        margin-top: 12px;
      }

      .icon-img,
      .info-item img,
      .btn-icon img {
        width: 2rem;
        height: 2rem;
      }

      .info-item {
        gap: 8px;
      }

      .btn-start {
        font-size: clamp(30px, 6vmin, 44px);
        padding: clamp(18px, 5vmin, 26px) clamp(40px, 12vmin, 80px);
        border: 5px solid #fff;
        box-shadow: 0 12px 0 #a04000, 0 15px 20px rgba(0, 0, 0, 0.4);
      }

      .card-front,
      .card-back {
        border: 6px solid white;
      }

      .modal-content {
        width: 50%;
      }
    }
  </style>

<body>

  <div id="overlay-inicio">
    <button class="btn-start" onclick="comecarJogo()">JOGAR ▶</button>
  </div>

  <header>
    <div class="nivel-badge">Nível <span id="nivel-atual">1</span></div>
    <div class="painel">
      <div class="info-item" title="Jogadas"><img src="img/fa-hand-pointer.png" alt="Jogadas" class="icon-img"> <span id="jogadas">0</span></div>
      <div class="info-item" title="Pares Encontrados"><img src="img/fa-check-double.png" alt="Pares Encontrados" class="icon-img"> <span
          id="pares-encontrados">0/0</span></div>
      <div class="info-item" title="Tempo"><img src="img/fa-stopwatch.png" alt="Tempo" class="icon-img"> <span id="tempo">00:00</span></div>

      <div class="botoes-controle">
        <button onclick="alternarMusica()" class="btn-icon" title="Ligar/Desligar Música">
          <img id="icone-musica" src="img/fa-music.png" alt="Música" class="icon-img">
        </button>
      </div>
    </div>
  </header>

  <div class="game-area">
    <div class="game-container" id="game"></div>
  </div>

  <div id="modal-nivel">
    <div class="modal-content">
      <h1 class="icone-vitoria">🐾</h1>
      <h2 class="titulo-vitoria">Nível Concluído!</h2>
      <p id="msg-vitoria" class="texto-vitoria">Excelente memória!</p>

      <div class="botoes-modal">
        <button class="btn-proximo" onclick="proximoNivel()">PRÓXIMO NÍVEL <i class="fas fa-arrow-right"></i></button>
      </div>
    </div>
  </div>

  <audio id="musica-fundo" loop>
    <source src="som/musicajogo.mp3" type="audio/mpeg">
  </audio>

  <audio id="som-vitoria">
    <source src="som/somvitoria.mp3" type="audio/mpeg">
  </audio>

  <script>
    let tempoTotal = 0;

    const todosAnimais = [
      "img/javali.png", "img/crocodilo.png", "img/hipopotamo.png",
      "img/rinoceronte.png", "img/cobra.png", "img/leopardo.png",
      "img/leao.png", "img/raposa.png", "img/elefante.png",
      "img/girafa.png", "img/macaco.png", "img/zebra.png"
    ];

    const niveis = [
      { pares: 3, colunas: 3 },
      { pares: 6, colunas: 4 },
      { pares: 8, colunas: 4 },
      { pares: 10, colunas: 5 },
      { pares: 12, colunas: 6 }
    ];

    let nivelAtual = 0;
    let viradas = [];
    let bloqueado = false;
    let jogadas = 0;
    let paresEncontrados = 0;
    let timerInterval;
    let segundos = 0;
    let jogoIniciado = false;

    let musicaTocando = false;
    const audioFundo = document.getElementById('musica-fundo');
    const iconeMusica = document.getElementById('icone-musica');

    const container = document.getElementById('game');
    const elJogadas = document.getElementById('jogadas');
    const elPares = document.getElementById('pares-encontrados');
    const elTempo = document.getElementById('tempo');
    const elNivel = document.getElementById('nivel-atual');
    const modal = document.getElementById('modal-nivel');
    const overlay = document.getElementById('overlay-inicio');

    function ajustarTamanhoCartas() {
      const config = niveis[nivelAtual];
      const totalCartas = config.pares * 2;
      const colunas = config.colunas;
      const linhas = Math.ceil(totalCartas / colunas);

      const header = document.querySelector('header');
      const headerHeight = header ? header.offsetHeight : 150;

      const estiloBody = window.getComputedStyle(document.body);
      const paddingVertical = parseFloat(estiloBody.paddingTop) + parseFloat(estiloBody.paddingBottom);
      const paddingHorizontal = parseFloat(estiloBody.paddingLeft) + parseFloat(estiloBody.paddingRight);

      const margemRespiro = 60;
      const alturaDisponivel = window.innerHeight - headerHeight - paddingVertical - margemRespiro;
      const larguraDisponivel = window.innerWidth - paddingHorizontal - margemRespiro;

      const gap = window.innerHeight <= 500 ? 12 : 10;

      const maxAlturaPorCarta = (alturaDisponivel - (gap * (linhas - 1))) / linhas;
      const maxLarguraPorCarta = (larguraDisponivel - (gap * (colunas - 1))) / colunas;

      let tamanhoFinal = Math.min(maxAlturaPorCarta, maxLarguraPorCarta);

      let limiteMobile = 90;

      if (nivelAtual >= 2) {
        limiteMobile = 110;
      }

      const isMobile = window.innerHeight <= 500;

      const limiteMaximo = isMobile ? limiteMobile : 160;

      tamanhoFinal = Math.min(tamanhoFinal, limiteMaximo);

      document.documentElement.style.setProperty('--tamanho-carta', `${Math.floor(tamanhoFinal)}px`);
    }

    window.addEventListener('resize', () => {
      if (overlay.style.display === 'none') {
        ajustarTamanhoCartas();
      }
    });

    function comecarJogo() {
      audioFundo.volume = 0.25;
      audioFundo.play().then(() => {
        musicaTocando = true;
        iconeMusica.src = "img/fa-music.png";
      }).catch(() => {
        musicaTocando = false;
        iconeMusica.src = "img/fa-volume-mute.png";
      });

      overlay.style.opacity = '0';
      setTimeout(() => {
        overlay.style.display = 'none';
        ajustarTamanhoCartas();
      }, 500);

      iniciarNivelLogica();
    }

    function alternarMusica() {
      if (musicaTocando) {
        audioFundo.pause();
        musicaTocando = false;
        iconeMusica.src = "img/fa-volume-mute.png";
      } else {
        audioFundo.volume = 0.25;
        audioFundo.play().catch(() => console.log("Interação necessária"));
        musicaTocando = true;
        iconeMusica.src = "img/fa-music.png";
      }
    }

    function embaralhar(array) {
      return array.sort(() => Math.random() - 0.5);
    }

    function iniciarNivelLogica() {
      const config = niveis[nivelAtual];

      viradas = [];
      bloqueado = false;
      jogadas = 0;
      paresEncontrados = 0;
      segundos = 0;
      jogoIniciado = false;
      pararTimer();

      elJogadas.innerText = "0";
      elTempo.innerText = "00:00";
      elNivel.innerText = nivelAtual + 1;
      elPares.innerText = `0/${config.pares}`;

      modal.style.display = "none";
      container.style.gridTemplateColumns = `repeat(${config.colunas}, 1fr)`;

      ajustarTamanhoCartas();

      let listaCartas = [];
      let animaisDoNivel = embaralhar([...todosAnimais]);

      for (let i = 0; i < config.pares; i++) {
        let img = animaisDoNivel[i % animaisDoNivel.length];
        listaCartas.push(img, img);
      }

      listaCartas = embaralhar(listaCartas);
      renderizarCartas(listaCartas);
    }

    function renderizarCartas(cartas) {
      container.innerHTML = '';
      cartas.forEach(imgSrc => {
        const card = document.createElement('div');
        card.classList.add('card');
        card.dataset.animal = imgSrc;

        card.innerHTML = `
          <div class="card-inner">
            <div class="card-front">?</div>
            <div class="card-back">
              <img src="${imgSrc}" alt="Animal">
            </div>
          </div>
        `;
        card.addEventListener('click', () => virarCarta(card));
        container.appendChild(card);
      });
    }

    function virarCarta(carta) {
      if (!jogoIniciado) { iniciarTimer(); jogoIniciado = true; }
      if (bloqueado || carta.classList.contains('flipped')) return;

      carta.classList.add('flipped');
      viradas.push(carta);

      if (viradas.length === 2) {
        jogadas++;
        elJogadas.innerText = jogadas;
        bloqueado = true;
        checarPar();
      }
    }

    function checarPar() {
      const [c1, c2] = viradas;
      const animal1 = c1.dataset.animal;
      const animal2 = c2.dataset.animal;

      if (animal1 === animal2) {
        paresEncontrados++;
        elPares.innerText = `${paresEncontrados}/${niveis[nivelAtual].pares}`;

        c1.classList.add('correto');
        c2.classList.add('correto');

        resetarJogada();

        if (paresEncontrados === niveis[nivelAtual].pares) {
          setTimeout(mostrarVitoria, 800);
        }
      } else {
        c1.classList.add('erro');
        c2.classList.add('erro');

        setTimeout(() => {
          c1.classList.remove('flipped', 'erro');
          c2.classList.remove('flipped', 'erro');
          resetarJogada();
        }, 1000);
      }
    }

    function resetarJogada() { viradas = []; bloqueado = false; }

    function iniciarTimer() {
      timerInterval = setInterval(() => {
        segundos++;
        const m = String(Math.floor(segundos / 60)).padStart(2, '0');
        const s = String(segundos % 60).padStart(2, '0');
        elTempo.innerText = `${m}:${s}`;
      }, 1000);
    }

    function pararTimer() { clearInterval(timerInterval); }

    function mostrarVitoria() {
      pararTimer();
      tempoTotal += segundos;

      const msg = document.getElementById('msg-vitoria');
      const btn = document.querySelector('.btn-proximo');
      const icone = document.querySelector('.icone-vitoria');

      if (nivelAtual < niveis.length - 1) {
        msg.innerText = `Nível ${nivelAtual + 1} completo em ${elTempo.innerText}!`;
        btn.innerHTML = `PRÓXIMO NÍVEL <i class="fas fa-arrow-right"></i>`;
        btn.onclick = proximoNivel;
      } else {
        const minutos = String(Math.floor(tempoTotal / 60)).padStart(2, '0');
        const segundosFinais = String(tempoTotal % 60).padStart(2, '0');
        const tempoFinalFormatado = `${minutos}:${segundosFinais}`;

        const audioVitoria = document.getElementById('som-vitoria');
        if (musicaTocando) audioFundo.pause();
        audioVitoria.play();

        icone.innerText = "🏆";

        msg.innerHTML = `
          PARABÉNS! Você zerou todos os níveis! 🎉<br><br>
          <strong>Seu tempo total foi:</strong>
          <span class="tempo-final">${tempoFinalFormatado}</span> 
        `;

        btn.innerHTML = `JOGAR NOVAMENTE <i class="fas fa-redo"></i>`;

        btn.onclick = () => {
          nivelAtual = 0; tempoTotal = 0;

          icone.innerText = "🐾";

          overlay.style.display = 'flex';
          setTimeout(() => overlay.style.opacity = '1', 10);

          audioVitoria.pause();
          audioVitoria.currentTime = 0;

          musicaTocando = false; audioFundo.pause(); audioFundo.currentTime = 0;
          iniciarNivelLogica();
        };
      }
      modal.style.display = "flex";
    }

    function proximoNivel() { nivelAtual++; iniciarNivelLogica(); }
  </script>

</body>
</html>
